services:
  db:
    image: postgres:17-alpine
    env_file: .env
    # Solo en loopback: nadie en la red local alcanza la base (STRIDE T-04).
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
